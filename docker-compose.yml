services:
  # ==========================================
  # 1. MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: interview_ai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - interview_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 2. Node.js / Express Backend Service
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: interview_ai_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/interview-ai}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-your_gemini_api_key}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - interview_network

  # ==========================================
  # 3. React / Vite / Nginx Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    container_name: interview_ai_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - interview_network

# Persistent data volume for MongoDB
volumes:
  mongodb_data:
    driver: local

# Internal network for container communication
networks:
  interview_network:
    driver: bridge
