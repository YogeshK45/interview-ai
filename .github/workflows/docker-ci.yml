name: Docker CI Pipeline

# Trigger workflow on push or pull requests to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for modern build capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build Backend Docker Image
      - name: Build Backend Image
        run: |
          docker build -t interview-ai-backend:latest ./Backend

      # Step 4: Build Frontend Docker Image
      - name: Build Frontend Image
        run: |
          docker build -t interview-ai-frontend:latest ./Frontend
